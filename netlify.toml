[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Redirect /login to login.html
[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200

# Catch-all: serve index.html for SPA behaviour
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
